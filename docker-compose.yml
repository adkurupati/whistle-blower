version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nba_officiating
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nba_officiating
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
  # backend:
  #   build: ./backend
  #   depends_on: [postgres, qdrant]
  #   env_file: .env
  #   ports:
  #     - "8000:8000"
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"
volumes:
  postgres_data:
  qdrant_data:
